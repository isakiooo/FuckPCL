name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish App/App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = 'artifacts/win-x64/FuckPCL.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'FuckPCL.exe was not generated.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FuckPCL.exe" | Set-Content -LiteralPath 'artifacts/win-x64/SHA256SUMS.txt' -Encoding ascii

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" 'artifacts/win-x64/FuckPCL.exe' 'artifacts/win-x64/SHA256SUMS.txt' --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
